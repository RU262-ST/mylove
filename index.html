<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love · I'm Sorry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fce4ec 0%, #f8e8e0 100%);
            font-family: 'Quicksand', sans-serif;
            padding: 1.5rem;
            overflow-x: hidden;
        }
        
        .card {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 245, 240, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 48px;
            box-shadow: 0 20px 60px rgba(180, 100, 90, 0.2), 0 8px 24px rgba(0, 0, 0, 0.05);
            padding: 2.8rem 2.5rem;
            text-align: center;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 220, 210, 0.5);
            position: relative;
            overflow: hidden;
            animation: cardGlow 3s ease-in-out infinite;
        }
        
        @keyframes cardGlow {
            0%,
            100% {
                box-shadow: 0 20px 60px rgba(180, 100, 90, 0.2), 0 8px 24px rgba(0, 0, 0, 0.05);
            }
            50% {
                box-shadow: 0 20px 80px rgba(180, 100, 90, 0.4), 0 8px 40px rgba(196, 90, 74, 0.15);
            }
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 32px;
            }
        }
        /* Floating Hearts Background */
        
        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .floating-heart {
            position: absolute;
            font-size: 1.5rem;
            animation: floatHeart 8s infinite ease-in-out;
            opacity: 0.3;
            color: #e8a598;
        }
        
        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-100px) rotate(720deg) scale(1);
                opacity: 0;
            }
        }
        /* Sparkles */
        
        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            animation: sparkleFloat 4s ease-in-out infinite;
            opacity: 0;
            font-size: 1rem;
        }
        
        @keyframes sparkleFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0) rotate(0deg);
            }
            20% {
                opacity: 0.8;
                transform: translateY(-20px) scale(1.2) rotate(20deg);
            }
            80% {
                opacity: 0.8;
                transform: translateY(-60px) scale(1) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.5) rotate(30deg);
            }
        }
        /* ANIMATED PERSON APOLOGIZING */
        
        .person-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1.5rem 0 2rem 0;
            padding: 1rem 0;
            z-index: 1;
        }
        
        .person {
            position: relative;
            font-size: 5rem;
            animation: personApologize 1.8s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 10px 30px rgba(196, 90, 74, 0.3));
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 2;
        }
        
        .person:hover {
            transform: scale(1.05);
        }
        
        .person-shadow {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 15px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: shadowPulse 1.8s ease-in-out infinite;
            z-index: 1;
        }
        
        @keyframes personApologize {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            15% {
                transform: translateY(-15px) rotate(-8deg) scale(1.05);
            }
            30% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            45% {
                transform: translateY(-10px) rotate(5deg) scale(1.02);
            }
            60% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            75% {
                transform: translateY(-20px) rotate(-5deg) scale(1.08);
            }
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
        }
        
        @keyframes shadowPulse {
            0%,
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translateX(-50%) scale(0.6);
                opacity: 0.2;
            }
        }
        /* Heart animation above person */
        
        .floating-love {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            animation: loveFloat 3s ease-in-out infinite;
        }
        
        @keyframes loveFloat {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: translate(0px, -30px) scale(1.2) rotate(10deg);
            }
            60% {
                opacity: 1;
                transform: translate(0px, -60px) scale(1) rotate(-5deg);
            }
            100% {
                opacity: 0;
                transform: translate(0px, -100px) scale(0.8) rotate(15deg);
            }
        }
        
        .heart-float {
            font-size: 2.8rem;
            line-height: 1;
            display: inline-block;
            animation: pulse 1.5s infinite ease-in-out;
            filter: drop-shadow(0 6px 20px rgba(200, 80, 70, 0.3));
            position: relative;
            z-index: 1;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1) rotate(0deg);
            }
            25% {
                transform: scale(1.1) rotate(-5deg);
            }
            50% {
                transform: scale(1.2) rotate(0deg);
            }
            75% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }
        
        .title {
            font-size: 3.2rem;
            font-weight: 700;
            color: #5d3a3a;
            letter-spacing: -0.5px;
            margin: 0.2rem 0 0.2rem 0;
            line-height: 1.2;
            text-shadow: 0 4px 12px rgba(180, 90, 70, 0.12);
            position: relative;
            z-index: 1;
            animation: titleShimmer 3s ease-in-out infinite;
        }
        
        @keyframes titleShimmer {
            0%,
            100% {
                text-shadow: 0 4px 12px rgba(180, 90, 70, 0.12);
            }
            50% {
                text-shadow: 0 4px 30px rgba(196, 90, 74, 0.25), 0 0 60px rgba(196, 90, 74, 0.1);
            }
        }
        /* FORM STYLES */
        
        .form-container {
            background: rgba(255, 248, 245, 0.7);
            border-radius: 32px;
            padding: 2rem 2rem;
            margin: 1.8rem 0 2.2rem 0;
            border: 1px solid rgba(255, 210, 195, 0.6);
            box-shadow: inset 0 2px 8px rgba(255, 200, 180, 0.3);
            position: relative;
            z-index: 1;
            animation: formPulse 3s ease-in-out infinite;
        }
        
        @keyframes formPulse {
            0%,
            100% {
                box-shadow: inset 0 2px 8px rgba(255, 200, 180, 0.3);
            }
            50% {
                box-shadow: inset 0 2px 20px rgba(255, 200, 180, 0.5), 0 0 30px rgba(196, 90, 74, 0.05);
            }
        }
        
        .form-container label {
            display: block;
            font-size: 1.1rem;
            color: #5d3a3a;
            font-weight: 600;
            margin-bottom: 0.8rem;
            animation: labelBounce 2s ease-in-out infinite;
        }
        
        @keyframes labelBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-3px);
            }
        }
        
        .form-container input {
            width: 100%;
            max-width: 280px;
            padding: 0.8rem 1.2rem;
            font-size: 1.1rem;
            border: 2px solid rgba(200, 150, 135, 0.3);
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.7);
            font-family: 'Quicksand', sans-serif;
            outline: none;
            transition: all 0.4s ease;
            text-align: center;
            color: #3f2a26;
            animation: inputGlow 3s ease-in-out infinite;
        }
        
        @keyframes inputGlow {
            0%,
            100% {
                border-color: rgba(200, 150, 135, 0.3);
            }
            50% {
                border-color: rgba(196, 90, 74, 0.5);
                box-shadow: 0 0 20px rgba(196, 90, 74, 0.1);
            }
        }
        
        .form-container input:focus {
            border-color: #c57967;
            box-shadow: 0 0 0 4px rgba(197, 121, 103, 0.15), 0 0 30px rgba(196, 90, 74, 0.1);
            background: rgba(255, 255, 255, 0.9);
            animation: none;
        }
        
        .form-container input::placeholder {
            color: #b5958a;
            font-weight: 300;
            animation: placeholderPulse 2s ease-in-out infinite;
        }
        
        @keyframes placeholderPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .form-container .btn-check {
            background: #d98c7a;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.8rem 2.6rem;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(190, 100, 80, 0.25);
            letter-spacing: 1px;
            font-family: 'Quicksand', sans-serif;
            border: 1px solid rgba(255, 220, 210, 0.5);
            background: rgba(200, 120, 105, 0.9);
            animation: btnGlow 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes btnGlow {
            0%,
            100% {
                box-shadow: 0 8px 20px rgba(190, 100, 80, 0.25);
            }
            50% {
                box-shadow: 0 8px 40px rgba(190, 100, 80, 0.45), 0 0 60px rgba(196, 90, 74, 0.15);
            }
        }
        
        .form-container .btn-check::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: btnShine 3s ease-in-out infinite;
            transform: rotate(45deg);
        }
        
        @keyframes btnShine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }
        
        .form-container .btn-check:hover {
            transform: scale(1.05) translateY(-2px);
            background: #c57967;
            box-shadow: 0 10px 40px rgba(180, 80, 60, 0.4);
            border-color: #c57967;
            animation: none;
        }
        
        .form-container .btn-check:active {
            transform: scale(0.95);
        }
        
        .btn-heart {
            display: inline-block;
            animation: btnHeartPulse 1.2s ease-in-out infinite;
        }
        
        @keyframes btnHeartPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }
        /* MESSAGE OUTPUT */
        
        .message-output {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 32px;
            background: rgba(255, 248, 245, 0.5);
            border: 1px solid rgba(255, 210, 195, 0.3);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
            position: relative;
            z-index: 1;
            animation: outputPulse 3s ease-in-out infinite;
        }
        
        @keyframes outputPulse {
            0%,
            100% {
                border-color: rgba(255, 210, 195, 0.3);
            }
            50% {
                border-color: rgba(196, 90, 74, 0.2);
            }
        }
        
        .message-output .sorry-message {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #3f2a26;
            font-weight: 500;
            animation: fadeInUp 0.8s ease forwards;
        }
        
        .message-output .sorry-message .big-heart {
            font-size: 1.8rem;
            display: inline-block;
            margin: 0 4px;
            color: #c45a4a;
            animation: heartbeat 1.2s infinite;
        }
        
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            14% {
                transform: scale(1.4);
            }
            28% {
                transform: scale(1);
            }
            42% {
                transform: scale(1.4);
            }
            70% {
                transform: scale(1);
            }
        }
        
        .message-output .error-message {
            font-size: 1.3rem;
            color: #c45a4a;
            font-weight: 600;
            animation: fadeInUp 0.6s ease forwards;
        }
        /* ANIMATIONS */
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes shimmerFaster {
            0% {
                background-position: -300% center;
            }
            100% {
                background-position: 300% center;
            }
        }
        
        .shimmer-text {
            background: linear-gradient(90deg, #c45a4a, #e8a598, #f5c6b0, #e8a598, #c45a4a);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerFaster 3s linear infinite;
            display: inline-block;
        }
        /* HIDDEN CLASS */
        
        .hidden {
            display: none !important;
        }
        /* FLOATING SORRY WORDS */
        
        .floating-sorry {
            position: absolute;
            font-size: 1.8rem;
            font-weight: 700;
            color: #c45a4a;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 4px 20px rgba(196, 90, 74, 0.3);
            animation: floatUp 3s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5) rotate(0deg);
            }
            20% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2) rotate(8deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.8) rotate(-15deg);
            }
        }
        
        .sorry-word {
            display: inline-block;
            animation: bounceWord 1.5s ease-in-out infinite;
        }
        
        @keyframes bounceWord {
            0%,
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
            25% {
                transform: translateY(-12px) scale(1.08) rotate(-3deg);
            }
            75% {
                transform: translateY(-6px) scale(1.04) rotate(3deg);
            }
        }
        
        .delay-1 {
            animation-delay: 0.1s;
        }
        
        .delay-2 {
            animation-delay: 0.3s;
        }
        
        .delay-3 {
            animation-delay: 0.5s;
        }
        
        .delay-4 {
            animation-delay: 0.7s;
        }
        
        .delay-5 {
            animation-delay: 0.9s;
        }
        
        .delay-6 {
            animation-delay: 1.1s;
        }
        
        .delay-7 {
            animation-delay: 1.3s;
        }
        /* Pet name styles */
        
        .pet-name {
            color: #c45a4a;
            font-weight: 700;
            display: inline-block;
            animation: glowPulse 1.8s ease-in-out infinite;
            position: relative;
        }
        
        @keyframes glowPulse {
            0%,
            100% {
                text-shadow: 0 0 10px rgba(196, 90, 74, 0.3);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 30px rgba(196, 90, 74, 0.6), 0 0 60px rgba(196, 90, 74, 0.2);
                transform: scale(1.05);
            }
        }
        
        .love-line {
            display: inline-block;
            margin-top: 0.3rem;
            font-size: 1.1rem;
            color: #7a5550;
            font-weight: 500;
            animation: fadeInUp 1s ease forwards;
            animation-delay: 0.3s;
            opacity: 0;
            transition: transform 0.3s ease;
        }
        
        .love-line:hover {
            transform: scale(1.02);
        }
        
        .big-sorry {
            font-size: 2rem;
            font-weight: 700;
            color: #c45a4a;
            animation: fadeInUp 1s ease forwards;
            animation-delay: 0.2s;
            opacity: 0;
            display: inline-block;
        }
        
        .error-heart {
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }
        /* Rain effect */
        
        .rain-drop {
            position: absolute;
            font-size: 0.8rem;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
            animation: rainFall 3s linear infinite;
            color: #e8a598;
        }
        
        @keyframes rainFall {
            0% {
                opacity: 0;
                transform: translateY(-10px) rotate(0deg);
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(360deg);
            }
        }
        /* Apology bubbles from person */
        
        .apology-bubble {
            position: absolute;
            font-size: 1.2rem;
            font-weight: 700;
            color: #c45a4a;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: bubbleFloat 2.5s ease-out forwards;
            background: rgba(255, 248, 245, 0.9);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            border: 2px solid rgba(196, 90, 74, 0.3);
            box-shadow: 0 4px 15px rgba(196, 90, 74, 0.15);
            white-space: nowrap;
        }
        
        @keyframes bubbleFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5) rotate(-10deg);
            }
            15% {
                opacity: 1;
                transform: translateY(-20px) scale(1.1) rotate(3deg);
            }
            50% {
                opacity: 1;
                transform: translateY(-50px) scale(1) rotate(-2deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.8) rotate(5deg);
            }
        }
        
        .bubble-heart {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation: heartBubbleFloat 2.8s ease-out forwards;
        }
        
        @keyframes heartBubbleFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0) rotate(0deg);
            }
            20% {
                opacity: 1;
                transform: translateY(-30px) scale(1.3) rotate(15deg);
            }
            60% {
                opacity: 1;
                transform: translateY(-80px) scale(1) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-130px) scale(0.5) rotate(20deg);
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 2.6rem;
            }
            .message-output .sorry-message {
                font-size: 1.1rem;
            }
            .form-container input {
                max-width: 100%;
            }
            .floating-sorry {
                font-size: 1.2rem;
            }
            .big-sorry {
                font-size: 1.5rem;
            }
            .message-output .error-message {
                font-size: 1.1rem;
            }
            .person {
                font-size: 3.5rem;
            }
            .person-shadow {
                width: 40px;
                height: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="card" id="card">
        <!-- Floating Hearts Background -->
        <div class="floating-hearts" id="floatingHearts"></div>

        <!-- Sparkles -->
        <div id="sparkles"></div>

        <!-- Rain Drops -->
        <div id="rainDrops"></div>

        <div class="heart-float" aria-hidden="true">❤️</div>

        <h1 class="title">For My Love</h1>

        <!-- ANIMATED PERSON APOLOGIZING -->
        <div class="person-container" id="personContainer">
            <!-- Person apologizing -->
            <div class="person" id="person">
                🙇‍♂️
                <div class="person-shadow"></div>
            </div>

            <!-- Floating hearts above the person -->
            <div class="floating-love" style="animation-delay: 0.5s; left: 45%; top: -10%;">💕</div>
            <div class="floating-love" style="animation-delay: 1.2s; left: 50%; top: -20%;">❤️</div>
            <div class="floating-love" style="animation-delay: 2s; left: 42%; top: -5%;">💖</div>
            <div class="floating-love" style="animation-delay: 0.8s; left: 52%; top: -15%;">💗</div>
        </div>

        <!-- FORM SECTION -->
        <div class="form-container">
            <label for="dobInput">🌸 Enter your date of birth</label>
            <input type="date" id="dobInput" placeholder="YYYY-MM-DD" aria-label="Enter your date of birth">
            <br>
            <button class="btn-check" id="checkBtn">
                <span class="btn-heart">💕</span>see<span class="btn-heart">💕</span>
            </button>
        </div>

        <!-- MESSAGE OUTPUT -->
        <div class="message-output" id="messageOutput">
            <div class="sorry-message hidden" id="sorryMessage">
                <!-- Big "I AM SORRY" at the top -->
                <div class="big-sorry">
                    <span class="big-heart">💗</span> I AM SORRY
                    <span class="big-heart">💗</span>
                </div>

                <br>

                <div style="display: inline-block; margin-top: 0.4rem; font-weight: 600; color: #5a3a34; font-size: 1.1rem; animation: fadeInUp 1s ease forwards; animation-delay: 0.4s; opacity: 0;">
                    I know I have hurt you, and that breaks my heart.
                </div>

                <!-- Pet names with "I am sorry" repeated -->
                <div class="love-line" style="animation-delay: 0.6s; font-size: 1.2rem;">
                    I'm sorry <span class="pet-name">my love</span> 💕
                </div>
                <div class="love-line" style="animation-delay: 0.8s; font-size: 1.2rem;">
                    I'm sorry <span class="pet-name">my baby</span> 💕
                </div>
                <div class="love-line" style="animation-delay: 1.0s; font-size: 1.2rem;">
                    I'm sorry <span class="pet-name">my princess</span> 👑💕
                </div>

                <!-- Animated Sorry Words -->
                <div style="margin-top: 1.2rem; font-size: 1.5rem; font-weight: 700; color: #c45a4a;">
                    <span class="sorry-word delay-1">I'm</span>
                    <span class="sorry-word delay-2">so</span>
                    <span class="sorry-word delay-3">sorry</span>
                    <span class="sorry-word delay-4">my</span>
                    <span class="sorry-word delay-5">love</span>
                    <span class="sorry-word delay-6">❤️</span>
                    <span class="sorry-word delay-7">👑</span>
                </div>
            </div>
            <div class="error-message hidden" id="errorMessage">
                <span class="error-heart">💕</span> Try again my baby
                <span class="error-heart">💕</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const HER_DOB = '2005-03-18';

            const dobInput = document.getElementById('dobInput');
            const checkBtn = document.getElementById('checkBtn');
            const sorryMsg = document.getElementById('sorryMessage');
            const errorMsg = document.getElementById('errorMessage');
            const card = document.getElementById('card');
            const person = document.getElementById('person');
            const personContainer = document.getElementById('personContainer');

            // Create floating hearts
            function createFloatingHearts() {
                const container = document.getElementById('floatingHearts');
                const hearts = ['❤️', '💕', '💗', '💖', '💓'];
                for (let i = 0; i < 25; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.fontSize = (Math.random() * 2 + 0.8) + 'rem';
                    heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
                    heart.style.animationDelay = (Math.random() * 12) + 's';
                    heart.style.opacity = (Math.random() * 0.3 + 0.1);
                    container.appendChild(heart);
                }
            }
            createFloatingHearts();

            // Create sparkles
            function createSparkles() {
                const container = document.getElementById('sparkles');
                const sparkleChars = ['✨', '⭐', '🌟', '💫'];
                for (let i = 0; i < 15; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.top = Math.random() * 100 + '%';
                    sparkle.style.fontSize = (Math.random() * 1.2 + 0.6) + 'rem';
                    sparkle.style.animationDuration = (Math.random() * 4 + 3) + 's';
                    sparkle.style.animationDelay = (Math.random() * 8) + 's';
                    container.appendChild(sparkle);
                }
            }
            createSparkles();

            // Create rain drops
            function createRainDrops() {
                const container = document.getElementById('rainDrops');
                const drops = ['💧', '🌸', '🌺'];
                for (let i = 0; i < 10; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.textContent = drops[Math.floor(Math.random() * drops.length)];
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.fontSize = (Math.random() * 1.2 + 0.6) + 'rem';
                    drop.style.animationDuration = (Math.random() * 4 + 3) + 's';
                    drop.style.animationDelay = (Math.random() * 10) + 's';
                    container.appendChild(drop);
                }
            }
            createRainDrops();

            // Create apology bubbles from person
            function createApologyBubble() {
                const bubbleTexts = ['💕 Sorry', 'I Love You', 'Forgive Me', 'My Love', '💗', 'I\'m Sorry', 'My Princess'];
                const bubble = document.createElement('div');
                bubble.className = 'apology-bubble';
                bubble.textContent = bubbleTexts[Math.floor(Math.random() * bubbleTexts.length)];
                bubble.style.left = (Math.random() * 30 + 35) + '%';
                bubble.style.top = '-10%';
                bubble.style.fontSize = (Math.random() * 0.5 + 1) + 'rem';
                bubble.style.animationDuration = (Math.random() * 1 + 2) + 's';
                personContainer.appendChild(bubble);

                setTimeout(() => {
                    bubble.remove();
                }, 3000);
            }

            // Create heart bubbles
            function createHeartBubble() {
                const hearts = ['❤️', '💕', '💗', '💖'];
                const bubble = document.createElement('div');
                bubble.className = 'bubble-heart';
                bubble.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                bubble.style.left = (Math.random() * 30 + 35) + '%';
                bubble.style.top = '-5%';
                bubble.style.fontSize = (Math.random() * 1 + 1.5) + 'rem';
                bubble.style.animationDuration = (Math.random() * 1 + 2.5) + 's';
                personContainer.appendChild(bubble);

                setTimeout(() => {
                    bubble.remove();
                }, 3500);
            }

            // Start continuous bubbles when apology is shown
            let bubbleInterval = null;
            let heartBubbleInterval = null;

            function startBubbles() {
                if (bubbleInterval) clearInterval(bubbleInterval);
                if (heartBubbleInterval) clearInterval(heartBubbleInterval);

                bubbleInterval = setInterval(createApologyBubble, 1200);
                heartBubbleInterval = setInterval(createHeartBubble, 800);
            }

            function stopBubbles() {
                if (bubbleInterval) {
                    clearInterval(bubbleInterval);
                    bubbleInterval = null;
                }
                if (heartBubbleInterval) {
                    clearInterval(heartBubbleInterval);
                    heartBubbleInterval = null;
                }
                // Remove existing bubbles
                document.querySelectorAll('.apology-bubble, .bubble-heart').forEach(el => el.remove());
            }

            // Create floating "I AM SORRY" words
            function createFloatingSorryWords() {
                const words = ['I AM SORRY', '❤️', '💕', 'Forgive Me', 'I Love You', '💗', 'My Princess', 'My Baby', 'My Love', 'SORRY', '💖', '👑'];
                const existing = document.querySelectorAll('.floating-sorry');
                existing.forEach(el => el.remove());

                for (let i = 0; i < 20; i++) {
                    const word = document.createElement('div');
                    word.className = 'floating-sorry';
                    word.textContent = words[Math.floor(Math.random() * words.length)];
                    word.style.left = (Math.random() * 80 + 10) + '%';
                    word.style.top = (Math.random() * 60 + 20) + '%';
                    word.style.fontSize = (Math.random() * 1.8 + 1) + 'rem';
                    word.style.animationDuration = (Math.random() * 2.5 + 2.5) + 's';
                    word.style.animationDelay = (Math.random() * 1.8) + 's';
                    word.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
                    card.appendChild(word);

                    setTimeout(() => {
                        word.remove();
                    }, 5000);
                }
            }

            // Show/hide messages
            function showMessage(type) {
                sorryMsg.classList.add('hidden');
                errorMsg.classList.add('hidden');
                stopBubbles();

                if (type === 'sorry') {
                    sorryMsg.classList.remove('hidden');
                    sorryMsg.classList.add('fade-in');

                    // Start apology bubbles
                    setTimeout(() => {
                        startBubbles();
                    }, 500);

                    // Create floating sorry words
                    setTimeout(createFloatingSorryWords, 300);

                    if (window.sorryInterval) {
                        clearInterval(window.sorryInterval);
                    }
                    window.sorryInterval = setInterval(() => {
                        if (!sorryMsg.classList.contains('hidden')) {
                            createFloatingSorryWords();
                        }
                    }, 4000);
                } else if (type === 'error') {
                    errorMsg.classList.remove('hidden');
                    errorMsg.classList.add('fade-in');
                    if (window.sorryInterval) {
                        clearInterval(window.sorryInterval);
                    }
                }
            }

            // Handle check
            function checkBirthday() {
                const enteredDate = dobInput.value;

                sorryMsg.classList.remove('fade-in');
                errorMsg.classList.remove('fade-in');

                if (!enteredDate) {
                    errorMsg.classList.remove('hidden');
                    errorMsg.innerHTML = '💕 Please enter your birthday first my baby 💕';
                    errorMsg.classList.add('fade-in');
                    stopBubbles();
                    if (window.sorryInterval) {
                        clearInterval(window.sorryInterval);
                    }
                    return;
                }

                if (enteredDate === HER_DOB) {
                    showMessage('sorry');
                } else {
                    showMessage('error');
                }
            }

            // Event listeners
            checkBtn.addEventListener('click', checkBirthday);
            dobInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkBirthday();
                }
            });

            // Click on person to create extra bubbles
            person.addEventListener('click', function() {
                if (!sorryMsg.classList.contains('hidden')) {
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            createApologyBubble();
                            createHeartBubble();
                        }, i * 300);
                    }
                }
            });

            // Start with empty message area
            sorryMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            console.log('💕 Click on the bowing person for extra apology bubbles! 💕');
        })();
    </script>
</body>

</html>
